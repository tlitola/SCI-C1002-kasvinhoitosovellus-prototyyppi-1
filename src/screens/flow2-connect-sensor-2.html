<main class="screen">
  <button class="back-link" data-back>← Takaisin</button>
  <h1 style="margin-bottom: 0.25rem;">Yhdistä sensori</h1>
  <p style="color: #888; font-size: 0.9rem; margin-bottom: 2rem;">Pidä puhelinta sensorin NFC-tagin lähellä.</p>

  <div id="nfc-connect" data-sensor-nav="flow2-sensor-connected-2" data-sensor-id="GS-5103" data-sensor-battery="45" style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
    <div style="position: relative; width: 80px; height: 80px;">
      <span style="position: absolute; inset: 0; border-radius: 50%; border: 5px solid #e0e0e0; border-top-color: #2e7d32; animation: spin 0.9s linear infinite;"></span>
    </div>
    <p id="nfc-status" style="font-size: 0.9rem; color: #666; text-align: center; margin: 0;">Etsitään sensoria...</p>
  </div>

  <ul id="sensor-list" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem;"></ul>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</main>
