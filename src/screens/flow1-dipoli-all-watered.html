      <div class="household-summary__stat">
        <span class="household-summary__value">3</span>
        <span class="household-summary__label">Kasvia</span>
      </div>
      <div class="household-summary__stat">
        <span class="household-summary__value">0</span>
        <span class="household-summary__label">Vaatii huomiota</span>
      </div>
    </div>
    <div class="household-summary__conditions">
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg></span>
        <span>22 °C</span>
      </div>
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></span>
        <span>45 %</span>
      </div>
    </div>

  <ul class="plant-list">
    <li class="plant-list__item" data-nav="flow1-peikonlehti-watered-confirmation">
      <img class="plant-list__img" src="/images/kilpipiilea.webp" alt="Kilpipiileä">
      <div class="plant-list__info">
        <span class="plant-list__name">Kilpipiileä</span>
        <span class="plant-list__sensor">Sensori <svg width="20" height="10" viewBox="0 0 24 12" style="vertical-align:middle;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="7.6" height="7" rx="1" fill="#f59e0b"/></svg></span>
        <span class="badge badge--green">Kunnossa</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
    <li class="plant-list__item" data-nav="flow1-ronsylilja-detail-v2">
      <img class="plant-list__img" src="/images/muorinkukka.webp" alt="Uurremuorinkukka">

        <span class="plant-list__sensor">Sensori <svg width="20" height="10" viewBox="0 0 24 12" style="vertical-align:middle;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="12.2" height="7" rx="1" fill="#22c55e"/></svg></span>

    </li>
    <li class="plant-list__item" data-nav="flow1-malakanlaikkuvehka-detail">
      <img class="plant-list__img" src="/images/soikkovehka.webp" alt="Soikkovehka">
      <div class="plant-list__info">
        <span class="plant-list__name">Soikkovehka</span>
        <span class="plant-list__sensor">Sensori <svg width="20" height="10" viewBox="0 0 24 12" style="vertical-align:middle;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="15.4" height="7" rx="1" fill="#22c55e"/></svg></span>

      </div>

    </li>

  <div class="plant-list-footer">
    <h3 class="plant-list-footer__title">Seuraava kastelu</h3>
    <div class="plant-list-footer__row">
      <span class="plant-list-footer__label">Suositeltu käynti</span>
      <span class="plant-list-footer__value plant-list-footer__value--ok">2 pv päästä</span>

    <div class="plant-list-footer__row">
      <span class="plant-list-footer__label">Joustava käynti</span>
