<main class="screen">
  <button class="back-link" data-back>← Takaisin</button>
  <h1 style="margin-bottom: 1.5rem;">Miten haluat lisätä kasvin?</h1>

  <div style="display: flex; flex-direction: column; gap: 1rem;">
    <button class="method-card" data-nav="flow2-camera">
      <span class="method-card__icon">📷</span>
      <div class="method-card__info">
        <strong>Lisää älykkäästi</strong>
        <span>Tunnista kasvi kuvaamalla</span>
      </div>
      <span class="method-card__arrow">›</span>
    </button>

    <button class="method-card" data-nav="flow2-add-plant-form">
      <span class="method-card__icon">✏️</span>
      <div class="method-card__info">
        <strong>Lisää manuaalisesti</strong>
        <span>Täytä kasvin tiedot itse</span>
      </div>
      <span class="method-card__arrow">›</span>
    </button>
  </div>
</main>
