<main class="screen">
  <button class="back-link" data-nav="flow1-select-household">← Takaisin</button>

  <section class="household-summary household-summary--warning">
    <div class="household-summary__icon">🏠</div>
    <h1>Dipoli</h1>
    <div class="household-summary__stats">
      <div class="household-summary__stat">
        <span class="household-summary__value">3</span>
        <span class="household-summary__label">Kasvia</span>
      </div>
      <div class="household-summary__stat">
        <span class="household-summary__value">1</span>
        <span class="household-summary__label">Vaatii huomiota</span>
      </div>
    </div>
    <div class="household-summary__conditions">
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">🌡️</span>
        <span>22 °C</span>
      </div>
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">💧</span>
        <span>45 %</span>
      </div>
    </div>
    <div class="household-summary__next">
      <span class="household-summary__next-label">Seuraava kastelu</span>
      <span class="badge badge--red">Tänään</span>
    </div>
  </section>

  <h2 class="section-title">Kasvit</h2>
  <ul class="plant-list">
    <li class="plant-list__item" data-nav="flow1-plant-needs-watering">
      <img class="plant-list__img" src="/images/plant_1.png" alt="Peikonlehti">
      <div class="plant-list__info">
        <span class="plant-list__name">Peikonlehti</span>
        <span class="plant-list__moisture">Maaperä: 15 % · Tavoite: 40 %</span>
        <span class="badge badge--red">Kastelu tarpeen</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
    <li class="plant-list__item" data-nav="flow1-plant-healthy">
      <img class="plant-list__img" src="/images/plant_2.png" alt="Mehikasvi">
      <div class="plant-list__info">
        <span class="plant-list__name">Mehikasvi</span>
        <span class="plant-list__moisture">Maaperä: 52 % · Tavoite: 40 %</span>
        <span class="badge badge--green">Kunnossa</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
    <li class="plant-list__item" data-nav="flow1-plant-healthy-vehka">
      <img class="plant-list__img" src="/images/plant_3.png" alt="Vehka">
      <div class="plant-list__info">
        <span class="plant-list__name">Vehka</span>
        <span class="plant-list__moisture">Maaperä: 68 % · Tavoite: 60 %</span>
        <span class="badge badge--green">Kunnossa</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
  </ul>
</main>
