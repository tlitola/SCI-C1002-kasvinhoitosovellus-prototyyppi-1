<main class="screen screen--plain">
  <button class="back-link" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Takaisin</button>
  <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 1.25rem;">
    <img id="plant-photo" data-photo-key="plantImage1" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px;" src="/images/IMG_2830.webp" alt="Kasvi">
  </div>

  <form class="plant-form" data-form-key="1" onsubmit="return false;">
    <div class="form-field">
      <label for="plant-name">Kasvin nimi</label>
      <input id="plant-name" type="text" required minlength="2" value="Peikonlehti">
    </div>

    <div class="form-field">
      <label for="watering-freq">Arvioitu kastelutiheys (päiviä)</label>
      <input id="watering-freq" type="number" required min="1" max="365" value="7">
    </div>

    <div class="form-field">
      <label for="watering-amount">Arvioitu kastelumäärä (dl)</label>
      <input id="watering-amount" type="number" required min="1" value="2">
    </div>

    <div class="form-field">
      <label for="last-watered">Viimeksi kasteltu</label>
      <input id="last-watered" type="date" required>
    </div>

    <div class="form-field">
      <label for="plant-size">Kasvin koko (cm)</label>
      <input id="plant-size" type="number" required min="1" value="50">
    </div>

    <div class="form-field">
      <label for="pot-size">Ruukun koko (l)</label>
      <input id="pot-size" type="number" required min="0.1" step="0.1" value="3.0">
    </div>

    <div class="form-field">
      <label for="watering-method">Kastelutapa</label>
      <select id="watering-method">
        <option>Anna maan kuivua</option>
        <option selected>Anna pintamullan kuivua</option>
        <option>Pidä maa kosteana</option>
        <option>Kastele runsaasti ja anna kuivua</option>
        <option>Pohjakastelu</option>
      </select>
    </div>

    <div class="form-field">
      <label for="notes">Muistiinpanot</label>
      <textarea id="notes" rows="5"></textarea>
    </div>

    <p style="font-size: 0.85rem; color: #666; font-style: italic;">
      Lopullinen kastelutiheys määräytyy näiden ohjeiden ja kasvista kerätyn sensoridatan perusteella.
    </p>

    <button class="btn btn--primary" data-nav="flow2-insert-sensor" style="width: 100%;">Lisää kasvi</button>
  </form>
  <script>document.getElementById('last-watered').value = new Date().toISOString().slice(0,10);</script>
</main>
