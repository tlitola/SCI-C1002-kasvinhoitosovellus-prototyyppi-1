<main class="screen">
  <button class="back-link" data-nav="flow1-select-household-happy">← Takaisin</button>

  <section class="household-summary household-summary--ok">
    <div class="household-summary__icon">🏠</div>
    <h1>Dipoli</h1>
    <div class="household-summary__stats">
      <div class="household-summary__stat">
        <span class="household-summary__value">3</span>
        <span class="household-summary__label">Kasvia</span>
      </div>
      <div class="household-summary__stat">
        <span class="household-summary__value">0</span>
        <span class="household-summary__label">Vaatii huomiota</span>
      </div>
    </div>
    <div class="household-summary__conditions">
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">🌡️</span>
        <span>22 °C</span>
      </div>
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">💧</span>
        <span>45 %</span>
      </div>
    </div>
    <div class="household-summary__next">
      <span class="household-summary__next-label">Seuraava kastelu</span>
      <span class="badge badge--green">4 pv päästä</span>
    </div>
  </section>

  <h2 class="section-title">Kasvit</h2>
  <ul class="plant-list">
    <li class="plant-list__item" data-nav="flow1-plant-watered-2">
      <img class="plant-list__img" src="/images/IMG_2828.webp" alt="Peikonlehti">
      <div class="plant-list__info">
        <span class="plant-list__name">Peikonlehti</span>
        <span class="badge badge--green">Kunnossa</span>
        <span class="plant-list__moisture" style="display:flex;align-items:center;gap:0.4rem;line-height:1;"><svg width="24" height="12" viewBox="0 0 24 12" style="vertical-align:middle;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="12.2" height="7" rx="1" fill="#22c55e"/></svg> Sensorin akku</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
    <li class="plant-list__item" data-nav="flow1-plant-watered-vehka-2">
      <img class="plant-list__img" src="/images/IMG_2829.webp" alt="Vehka">
      <div class="plant-list__info">
        <span class="plant-list__name">Vehka</span>
        <span class="badge badge--green">Kunnossa</span>
        <span class="plant-list__moisture" style="display:flex;align-items:center;gap:0.4rem;line-height:1;"><svg width="24" height="12" viewBox="0 0 24 12" style="vertical-align:middle;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="7.6" height="7" rx="1" fill="#f59e0b"/></svg> Sensorin akku</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
    <li class="plant-list__item" data-nav="flow1-plant-healthy">
      <img class="plant-list__img" src="/images/IMG_2832.webp" alt="Mehikasvi">
      <div class="plant-list__info">
        <span class="plant-list__name">Mehikasvi</span>
        <span class="badge badge--green">Kunnossa</span>
        <span class="plant-list__moisture" style="display:flex;align-items:center;gap:0.4rem;line-height:1;"><svg width="24" height="12" viewBox="0 0 24 12" style="vertical-align:middle;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="15.4" height="7" rx="1" fill="#22c55e"/></svg> Sensorin akku</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
  </ul>
</main>
