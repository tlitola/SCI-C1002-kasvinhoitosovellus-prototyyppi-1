<main class="screen">
  <div class="household-summary household-summary--ok">
    <div class="household-summary__icon">🏡</div>
    <h1>Kotitalous</h1>
    <span class="badge badge--green">Omistaja</span>
    <div class="household-summary__stats" style="margin-top: 0.75rem;">
      <div class="household-summary__stat">
        <span class="household-summary__value">1</span>
        <span class="household-summary__label">Kasvi</span>
      </div>
      <div class="household-summary__stat">
        <span class="household-summary__value">0</span>
        <span class="household-summary__label">Vaatii huomiota</span>
      </div>
    </div>
  </div>

  <h2 class="section-title">Kasvit</h2>
  <ul class="plant-list">
    <li class="plant-list__item" style="cursor: default;">
      <img class="plant-list__img" src="/images/plant_2.png" alt="Mehikasvi">
      <div class="plant-list__info">
        <span class="plant-list__name">Mehikasvi</span>
        <span class="plant-list__moisture">Maaperä: 48 % · Tavoite: 50 %</span>
        <span class="badge badge--green">Kunnossa</span>
      </div>
    </li>
  </ul>

  <button class="btn btn--primary" data-nav="flow2-add-plant-method" style="width: 100%; margin-top: 1.5rem;">+ Lisää kasvi</button>
</main>
