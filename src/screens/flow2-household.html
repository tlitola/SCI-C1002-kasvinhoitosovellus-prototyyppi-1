<main class="screen">
  <div class="household-summary household-summary--ok">
    <div class="household-summary__icon">🏡</div>
    <h1>Kotitalous</h1>
    <span class="badge badge--green">Omistaja</span>
    <div class="household-summary__conditions">
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">🌡️</span>
        <span>21 °C</span>
      </div>
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">💧</span>
        <span>48 %</span>
      </div>
    </div>
    <div class="household-summary__stats" style="margin-top: 0.75rem;">
      <div class="household-summary__stat">
        <span class="household-summary__value">0</span>
        <span class="household-summary__label">Kasveja</span>
      </div>
      <div class="household-summary__stat">
        <span class="household-summary__value">0</span>
        <span class="household-summary__label">Vaatii huomiota</span>
      </div>
    </div>
  </div>

  <h2 class="section-title">Kasvit</h2>
  <p style="color: #888; font-size: 0.9rem; text-align: center; margin: 1rem 0 1.5rem;">Ei kasveja vielä. Lisää ensimmäinen kasvi!</p>

  <button class="btn btn--primary" data-nav="flow2-camera" style="width: 100%; margin-top: 0.5rem;">+ Lisää kasvi</button>
</main>
