<main class="screen">
  <button class="back-link" data-nav="flow3-select-household">← Takaisin</button>

  <section class="household-summary household-summary--warning">
    <div class="household-summary__icon">🏠</div>
    <h1>Dipoli</h1>
    <div class="household-summary__stats">
      <div class="household-summary__stat">
        <span class="household-summary__value">3</span>
        <span class="household-summary__label">Kasvia</span>
      </div>
      <div class="household-summary__stat">
        <span class="household-summary__value">1</span>
        <span class="household-summary__label">Vaatii huomiota</span>
      </div>
    </div>
    <div class="household-summary__conditions">
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">🌡️</span>
        <span>22 °C</span>
      </div>
      <div class="household-summary__condition">
        <span class="household-summary__condition-icon">💧</span>
        <span>45 %</span>
      </div>
    </div>
    <div class="household-summary__next">
      <span class="household-summary__next-label">Seuraava kastelu</span>
      <span class="badge badge--red">Päivän myöhässä</span>
    </div>
  </section>

  <h2 class="section-title">Kasvit</h2>
  <ul class="plant-list">
    <li class="plant-list__item" data-nav="flow3-peikonlehti-battery-warning">
      <img class="plant-list__img" src="/images/soikkovehka.webp" alt="Soikkovehka">
      <div class="plant-list__info">
        <span class="plant-list__name" style="display:inline-flex;align-items:center;">Soikkovehka <svg width="20" height="10" viewBox="0 0 24 12" style="vertical-align:middle;margin-left:0.75rem;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="2.5" height="7" rx="1" fill="#ef4444"/></svg></span>
        <span class="badge badge--red">Kastelu päivän myöhässä</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
    <li class="plant-list__item" data-nav="flow3-ronsylilja-detail">
      <img class="plant-list__img" src="/images/muorinkukka.webp" alt="Uurremuorinkukka">
      <div class="plant-list__info">
        <span class="plant-list__name" style="display:inline-flex;align-items:center;">Uurremuorinkukka <svg width="20" height="10" viewBox="0 0 24 12" style="vertical-align:middle;margin-left:0.75rem;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="12.2" height="7" rx="1" fill="#22c55e"/></svg></span>
        <span class="badge badge--green">Kunnossa</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
    <li class="plant-list__item" data-nav="flow3-malakanlaikkuvehka-detail">
      <img class="plant-list__img" src="/images/kilpipiilea.webp" alt="Kilpipiileä">
      <div class="plant-list__info">
        <span class="plant-list__name" style="display:inline-flex;align-items:center;">Kilpipiileä <svg width="20" height="10" viewBox="0 0 24 12" style="vertical-align:middle;margin-left:0.75rem;"><rect x="0.75" y="1" width="19.5" height="10" rx="2" fill="none" stroke="#555" stroke-width="1.5"/><rect x="20.25" y="4" width="3" height="4" rx="1" fill="#555"/><rect x="2" y="2.5" width="15.4" height="7" rx="1" fill="#22c55e"/></svg></span>
        <span class="badge badge--green">Kunnossa</span>
      </div>
      <div class="plant-list__arrow">›</div>
    </li>
  </ul>
</main>
