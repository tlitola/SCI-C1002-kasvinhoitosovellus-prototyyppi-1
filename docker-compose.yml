version: "3.5"

#Modified from https://forum.gitlab.com/t/example-gitlab-runner-docker-compose-configuration/67344
services:
  dind:
    image: docker:20-dind
    restart: always
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --storage-driver=overlay2
    volumes:
      - docker-cache:/var/lib/docker

  gitlab-runner:
    restart: always
    image: gitlab/gitlab-runner:alpine
    depends_on:
      - dind
    environment:
      - DOCKER_HOST=tcp://dind:2375
    volumes:
      - ./gitlab-runner/config:/etc/gitlab-runner:z

  register-gitlab-runner:
    restart: 'no'
    image: gitlab/gitlab-runner:alpine
    depends_on:
      - dind
    env_file:
      - .env
    command:
      - register
      - --non-interactive
      - --locked=true
      - --name=${RUNNER_NAME}
      - --executor=docker
      - --docker-image=docker:20-dind
      - --docker-volumes=/var/run/docker.sock:/var/run/docker.sock
    volumes:
      - ./gitlab-runner/config:/etc/gitlab-runner:z

volumes:
  docker-cache:
    driver: local